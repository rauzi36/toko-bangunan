<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel - Toko Bangunan</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hidden { display: none !important; }
        .product-img-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #dee2e6; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) {
            .navbar-brand { font-size: 1.1rem; }
            .btn-sm-mobile { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
            .table-responsive { border: 0; box-shadow: none; }
            .table { font-size: 0.85rem; }
        }
        #productForm { scroll-margin-top: 80px; }
        .table-success, .table-danger { --bs-table-bg-opacity: 0.6; }
        /* Style Search Bar */
        .search-container { position: relative; margin-bottom: 1rem; }
        .search-icon { position: absolute; top: 50%; left: 15px; transform: translateY(-50%); color: #aaa; }
        #searchInput { padding-left: 40px; border-radius: 50px; }
    </style>
</head>
<body class="bg-light">

<div id="loginSection" class="container d-flex align-items-center justify-content-center vh-100 hidden">
    <div class="card shadow border-0" style="width: 100%; max-width: 400px;">
        <div class="card-header bg-danger text-white text-center py-3"><h4 class="mb-0 fw-bold">🔐 Login Admin</h4></div>
        <div class="card-body p-4">
            <form id="loginForm">
                <div class="mb-3"><label class="form-label text-muted small">Username</label><input type="text" id="username" class="form-control form-control-lg" required></div>
                <div class="mb-4"><label class="form-label text-muted small">Password</label><input type="password" id="password" class="form-control form-control-lg" required></div>
                <button type="submit" class="btn btn-danger w-100 btn-lg">Masuk Dashboard</button>
                <div id="loginError" class="alert alert-danger mt-3 hidden small text-center">Username atau Password salah!</div>
            </form>
        </div>
    </div>
</div>

<div id="dashboardSection" class="hidden fade-in">
    <nav class="navbar navbar-dark bg-dark sticky-top shadow-sm mb-3">
        <div class="container">
            <span class="navbar-brand fw-bold">🛠️ Admin Panel</span>
            <button onclick="logout()" class="btn btn-outline-light btn-sm">🚪 Logout</button>
        </div>
    </nav>

    <div class="container pb-5">
        
        <div class="row">
            <div class="col-12">
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" class="form-control form-control-lg shadow-sm" placeholder="Cari nama pelanggan atau produk...">
                </div>
            </div>
        </div>

        <ul class="nav nav-pills mb-3 flex-nowrap overflow-auto" id="myTab">
            <li class="nav-item"><a class="nav-link active text-nowrap" data-bs-toggle="tab" href="#pesanan" onclick="clearSearch()">📦 Pesanan Masuk</a></li>
            <li class="nav-item ms-2"><a class="nav-link text-nowrap" data-bs-toggle="tab" href="#produk" onclick="clearSearch()">🧱 Kelola Produk</a></li>
        </ul>

        <div class="tab-content">
            
            <div class="tab-pane fade show active" id="pesanan">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0 text-nowrap">
                                <thead class="table-light"><tr><th class="ps-3">Pelanggan</th><th>Barang</th><th>Total</th><th>Status</th><th class="text-end pe-3">Aksi</th></tr></thead>
                                <tbody id="orderTable">
                                    <tr>
                                        <td colspan="5" class="text-center p-5">
                                            <div class="spinner-border text-primary mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
                                            <p class="text-muted mb-0 fw-bold">Sedang memuat data pesanan...</p>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="produk">
                <div class="card mb-4 border-0 shadow-sm bg-white">
                    <div class="card-header bg-primary text-white"><h6 class="mb-0 fw-bold" id="formTitle">➕ Tambah Produk</h6></div>
                    <div class="card-body">
                        <form id="productForm" class="row g-3" enctype="multipart/form-data">
                            <input type="hidden" id="pId">
                            <div class="col-12"><input type="text" id="pName" class="form-control" placeholder="Nama Produk" required></div>
                            <div class="col-6 col-md-3"><input type="number" id="pPrice" class="form-control" placeholder="Harga" required></div>
                            <div class="col-6 col-md-3"><input type="number" id="pStock" class="form-control" placeholder="Stok"></div>
                            <div class="col-12">
                                <div class="d-flex gap-3 mb-2">
                                    <div class="form-check"><input class="form-check-input" type="radio" name="imgOption" id="optUrl" value="url" checked onchange="toggleImageInput()"><label class="form-check-label small">Link URL</label></div>
                                    <div class="form-check"><input class="form-check-input" type="radio" name="imgOption" id="optUpload" value="upload" onchange="toggleImageInput()"><label class="form-check-label small">Upload File</label></div>
                                </div>
                                <input type="text" id="pImageURL" class="form-control" placeholder="https://...">
                                <input type="file" id="pImageFile" class="form-control hidden" accept="image/*">
                            </div>
                            <div class="col-12 mt-4"><button type="submit" id="btnSubmit" class="btn btn-primary w-100 fw-bold">Simpan Produk</button><button type="button" onclick="resetForm()" id="btnCancel" class="btn btn-secondary w-100 mt-2 hidden">Batal Edit</button></div>
                        </form>
                    </div>
                </div>
                <div id="productTable" class="row g-3"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // --- VARIABLES GLOBAL (Untuk Pencarian) ---
    let globalOrders = [];
    let globalProducts = [];

    // --- AUTHENTICATION ---
    async function checkAuth() { 
        try { 
            const r = await fetch('/api/check-auth'); 
            if(r.ok){ 
                const d=await r.json(); 
                d.loggedIn ? (showDashboard(), loadData()) : showLogin(); 
            } else showLogin(); 
        } catch { showLogin(); } 
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => { 
        e.preventDefault(); 
        const u = document.getElementById('username').value; 
        const p = document.getElementById('password').value; 
        const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: u, password: p}) }); 
        if (res.ok) { showDashboard(); loadData(); } 
        else { document.getElementById('loginError').classList.remove('hidden'); } 
    });

    async function logout() { await fetch('/api/logout', { method: 'POST' }); window.location.reload(); }
    function showLogin() { document.getElementById('loginSection').classList.remove('hidden'); document.getElementById('dashboardSection').classList.add('hidden'); }
    function showDashboard() { document.getElementById('loginSection').classList.add('hidden'); document.getElementById('dashboardSection').classList.remove('hidden'); }
    function loadData() { loadOrders(); loadProducts(); }

    // --- LOGIC PESANAN ---
    async function loadOrders() {
        try {
            const res = await fetch('/api/orders');
            if (res.status === 401) { showLogin(); return; }
            if(!res.ok) return;
            
            globalOrders = await res.json(); // Simpan ke variable global
            
            // Cek apakah ada pencarian aktif?
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            if(keyword) {
                const filtered = globalOrders.filter(o => o.customerName.toLowerCase().includes(keyword));
                renderOrders(filtered);
            } else {
                renderOrders(globalOrders);
            }

        } catch (e) { console.error(e); }
    }

    // Fungsi Render Pesanan (Dipisah agar bisa dipanggil Search)
    function renderOrders(data) {
        const tbody = document.getElementById('orderTable');
        
        if(data.length === 0) { 
            tbody.innerHTML = '<tr><td colspan="5" class="text-center p-5 text-muted fw-bold">Tidak ada data ditemukan.</td></tr>'; 
            return; 
        }

        tbody.innerHTML = data.map(o => {
            let rowClass = '';
            if (o.status === 'Selesai') rowClass = 'table-success';
            else if (o.status === 'Dibatalkan') rowClass = 'table-danger text-muted';

            return `
            <tr class="${rowClass}">
                <td class="ps-3"><strong class="d-block text-truncate" style="max-width: 150px;">${o.customerName}</strong><small class="text-muted" style="font-size:0.75rem">${o.address.substring(0,20)}...</small></td>
                <td><small class="d-block text-truncate" style="max-width:120px;">${o.items.map(i => i.name).join(', ')}</small></td>
                <td class="fw-bold">Rp ${o.totalPrice.toLocaleString('id-ID')}</td>
                <td>
                    <select onchange="updateStatus('${o._id}', this.value)" class="form-select form-select-sm" style="min-width: 130px; font-size: 0.8rem;">
                        <option ${o.status=='Menunggu Konfirmasi'?'selected':''}>Menunggu Konfirmasi</option>
                        <option ${o.status=='Diproses'?'selected':''}>Diproses</option>
                        <option ${o.status=='Dalam Pengiriman'?'selected':''}>Dalam Pengiriman</option>
                        <option ${o.status=='Selesai'?'selected':''} style="color:green;font-weight:bold">Selesai</option>
                        <option ${o.status=='Dibatalkan'?'selected':''} style="color:red;font-weight:bold">Dibatalkan</option>
                    </select>
                </td>
                <td class="text-end pe-3">
                    <div class="d-flex justify-content-end gap-1">
                        <a href="https://wa.me/${o.whatsapp}" target="_blank" class="btn btn-success btn-sm btn-sm-mobile">📞</a>
                        <button onclick="deleteOrder('${o._id}')" class="btn btn-outline-danger btn-sm btn-sm-mobile" title="Hapus">🗑️</button>
                    </div>
                </td>
            </tr>
        `}).join('');
    }

    // --- LOGIC PRODUK ---
    async function loadProducts() { 
        try {
            const r = await fetch('/api/products'); 
            if (r.status === 401) { showLogin(); return; }
            const p = await r.json();
            
            globalProducts = p; // Simpan ke global
            
            // Cek pencarian aktif
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            if(keyword) {
                const filtered = globalProducts.filter(x => x.name.toLowerCase().includes(keyword));
                renderProducts(filtered);
            } else {
                renderProducts(globalProducts); 
            }
            
            return p;
        } catch (e) { return []; }
    }

    // Fungsi Render Produk
    function renderProducts(data) {
        const container = document.getElementById('productTable');
        if(data.length === 0) { container.innerHTML = '<div class="col-12 text-center p-4 text-muted">Produk tidak ditemukan</div>'; return; }

        container.innerHTML = data.map(x => `
            <div class="col-12 col-sm-6 col-md-4">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body d-flex align-items-center gap-3">
                        <img src="${x.image||'https://via.placeholder.com/60'}" class="product-img-thumb flex-shrink-0" onerror="this.src='https://via.placeholder.com/60?text=Error'">
                        <div class="flex-grow-1 overflow-hidden">
                            <h6 class="card-title mb-1 text-truncate">${x.name}</h6>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="text-primary fw-bold small">Rp ${x.price.toLocaleString()}</span>
                                <span class="badge bg-light text-dark border">Stok: ${x.stock}</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer bg-white border-top-0 d-flex gap-2">
                        <button onclick="editProduct('${x._id}')" class="btn btn-warning btn-sm w-50 fw-bold">Edit</button>
                        <button onclick="deleteProduct('${x._id}')" class="btn btn-outline-danger btn-sm w-50">Hapus</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // --- FITUR PENCARIAN (EVENT LISTENER) ---
    document.getElementById('searchInput').addEventListener('input', function(e) {
        const keyword = e.target.value.toLowerCase();
        
        // Cek tab mana yang aktif
        const activeTab = document.querySelector('.nav-link.active').getAttribute('href');

        if(activeTab === '#pesanan') {
            // Filter Pesanan berdasarkan Nama Pelanggan
            const filteredOrders = globalOrders.filter(o => o.customerName.toLowerCase().includes(keyword));
            renderOrders(filteredOrders);
        } else {
            // Filter Produk berdasarkan Nama Produk
            const filteredProducts = globalProducts.filter(p => p.name.toLowerCase().includes(keyword));
            renderProducts(filteredProducts);
        }
    });

    // Reset pencarian saat ganti tab
    function clearSearch() {
        document.getElementById('searchInput').value = '';
        renderOrders(globalOrders);
        renderProducts(globalProducts);
    }

    // --- ACTIONS ---
    async function updateStatus(id, status) {
        const res = await fetch(`/api/orders/${id}`, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({status}) });
        if (res.ok) loadOrders(); 
        else if(res.status === 401) showLogin();
        else alert('Gagal update status');
    }

    async function deleteOrder(id) {
        if(confirm('⚠️ Yakin ingin menghapus riwayat pesanan ini secara permanen?')) {
            const res = await fetch(`/api/orders/${id}`, { method: 'DELETE' });
            if (res.ok) loadOrders(); 
            else if(res.status === 401) showLogin();
            else alert('Gagal menghapus pesanan');
        }
    }

    // --- FORM HANDLING ---
    window.toggleImageInput = () => { const isUp = document.getElementById('optUpload').checked; document.getElementById('pImageURL').classList.toggle('hidden', isUp); document.getElementById('pImageFile').classList.toggle('hidden', !isUp); };
    
    document.getElementById('productForm').addEventListener('submit', async (e) => { 
        e.preventDefault(); 
        const id=document.getElementById('pId').value; 
        const url=id?`/api/products/${id}`:'/api/products'; 
        const method=id?'PUT':'POST'; 
        const fd=new FormData(); 
        fd.append('name',document.getElementById('pName').value); 
        fd.append('price',document.getElementById('pPrice').value); 
        fd.append('stock',document.getElementById('pStock').value); 
        if(document.getElementById('optUpload').checked) fd.append('imageFile',document.getElementById('pImageFile').files[0]); 
        else fd.append('imageURL',document.getElementById('pImageURL').value); 
        
        const res = await fetch(url,{method,body:fd});
        if(res.ok){ loadProducts(); resetForm(); } else if(res.status === 401) { alert('Sesi habis.'); showLogin(); }
    });

    window.editProduct = (id) => { 
        // Menggunakan data global agar tidak perlu fetch ulang
        const p = globalProducts.find(x => x._id === id); 
        if(!p) return; 
        
        document.getElementById('pId').value = p._id;
        document.getElementById('pName').value = p.name;
        document.getElementById('pPrice').value = p.price;
        document.getElementById('pStock').value = p.stock;
        
        document.getElementById('optUrl').checked = true;
        toggleImageInput();
        document.getElementById('pImageURL').value = p.image || ''; 
        
        document.getElementById('formTitle').innerText = '✏️ Edit Produk';
        document.querySelector('.card-header').classList.replace('bg-primary','bg-warning');
        document.getElementById('btnSubmit').innerText = 'Update';
        document.getElementById('btnCancel').classList.remove('hidden');
        document.getElementById('productForm').scrollIntoView({behavior: 'smooth'});
    }

    window.resetForm = () => {
        document.getElementById('productForm').reset();
        document.getElementById('pId').value='';
        toggleImageInput();
        document.getElementById('formTitle').innerText='➕ Tambah Produk';
        document.querySelector('.card-header').classList.replace('bg-warning','bg-primary');
        document.getElementById('btnSubmit').innerText='Simpan Produk';
        document.getElementById('btnCancel').classList.add('hidden');
    }

    async function deleteProduct(id){ if(confirm('Hapus produk?')) { const res = await fetch(`/api/products/${id}`,{method:'DELETE'}); if(res.ok) loadProducts(); else if(res.status===401) showLogin(); } }
    
    // --- AUTO REFRESH (SILENT) ---
    setInterval(() => {
        const activeTab = document.querySelector('.nav-link.active').getAttribute('href');
        if (activeTab === '#pesanan') {
            loadOrdersSilent(); 
        }
    }, 5000);

    function playNotificationSound() {
        const audio = new Audio('/lana-notification.mp3'); 
        audio.play().catch(e => console.log('Autoplay diblokir browser'));
    }

    let lastOrderCount = 0;
    async function loadOrdersSilent() {
        // Jika sedang mengetik pencarian, jangan refresh otomatis agar hasil tidak hilang
        if(document.getElementById('searchInput').value.trim() !== '') return;

        try {
            const res = await fetch('/api/orders');
            if(res.status===401) { showLogin(); return; }
            if(!res.ok) return;
            const orders = await res.json();
            
            // Cek perubahan jumlah
            if (orders.length !== lastOrderCount) {
                lastOrderCount = orders.length;
                loadOrders(); 
                playNotificationSound(); 
            }
        } catch (err) { console.log('Skip refresh'); }
    }

    // --- VALIDASI PESAN INDONESIA ---
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('input[required]').forEach(f => {
            f.oninvalid = (e) => e.target.setCustomValidity('Mohon isi data ini dulu!');
            f.oninput = (e) => e.target.setCustomValidity('');
        });
    });

    checkAuth();
</script>
</body>
</html>

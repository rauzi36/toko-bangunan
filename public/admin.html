<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel - Toko Bangunan</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        .hidden { display: none !important; }
        .product-img-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #dee2e6; }
        
        /* Animasi */
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Tweak Mobile */
        @media (max-width: 768px) {
            .navbar-brand { font-size: 1.1rem; }
            .btn-sm-mobile { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
            
            /* Agar tabel tidak merusak layout di HP */
            .table-responsive { 
                border: 0; 
                box-shadow: none;
            }
            /* Font tabel lebih kecil di HP */
            .table { font-size: 0.85rem; }
        }

        /* Agar saat klik Edit, scroll tidak tertutup navbar */
        #productForm { scroll-margin-top: 80px; }
    </style>
</head>
<body class="bg-light">

<div id="loginSection" class="container d-flex align-items-center justify-content-center vh-100 hidden">
    <div class="card shadow border-0" style="width: 100%; max-width: 400px;">
        <div class="card-header bg-danger text-white text-center py-3">
            <h4 class="mb-0 fw-bold">🔐 Login Admin</h4>
        </div>
        <div class="card-body p-4">
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label text-muted small">Username</label>
                    <input type="text" id="username" class="form-control form-control-lg" placeholder="admin" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted small">Password</label>
                    <input type="password" id="password" class="form-control form-control-lg" placeholder="••••••" required>
                </div>
                <button type="submit" class="btn btn-danger w-100 btn-lg">Masuk Dashboard</button>
            </form>
            <div id="loginError" class="alert alert-danger mt-3 hidden small text-center">
                Username atau Password salah!
            </div>
        </div>
    </div>
</div>

<div id="dashboardSection" class="hidden fade-in">
    
    <nav class="navbar navbar-dark bg-dark sticky-top shadow-sm mb-3">
        <div class="container">
            <span class="navbar-brand fw-bold">🛠️ Admin Panel</span>
            <button onclick="logout()" class="btn btn-outline-light btn-sm">
                🚪 Logout
            </button>
        </div>
    </nav>

    <div class="container pb-5">
        
        <div class="overflow-auto mb-3">
            <ul class="nav nav-pills flex-nowrap" id="myTab">
                <li class="nav-item">
                    <a class="nav-link active text-nowrap" data-bs-toggle="tab" href="#pesanan">📦 Pesanan Masuk</a>
                </li>
                <li class="nav-item ms-2">
                    <a class="nav-link text-nowrap" data-bs-toggle="tab" href="#produk">🧱 Kelola Produk</a>
                </li>
            </ul>
        </div>

        <div class="tab-content">
            
            <div class="tab-pane fade show active" id="pesanan">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0 text-nowrap">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-3">Pelanggan</th>
                                        <th>Barang</th>
                                        <th>Total</th>
                                        <th>Status</th>
                                        <th class="text-end pe-3">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="orderTable">
                                    </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="produk">
                
                <div class="card mb-4 border-0 shadow-sm bg-white">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h6 class="mb-0 fw-bold" id="formTitle">➕ Tambah Produk</h6>
                    </div>
                    <div class="card-body">
                        <form id="productForm" class="row g-3" enctype="multipart/form-data">
                            <input type="hidden" id="pId">

                            <div class="col-12">
                                <label class="form-label small text-muted">Nama Produk</label>
                                <input type="text" id="pName" class="form-control" placeholder="Contoh: Semen Gresik 40kg" required>
                            </div>
                            
                            <div class="col-6 col-md-3">
                                <label class="form-label small text-muted">Harga (Rp)</label>
                                <input type="number" id="pPrice" class="form-control" placeholder="0" required>
                            </div>
                            
                            <div class="col-6 col-md-3">
                                <label class="form-label small text-muted">Stok</label>
                                <input type="number" id="pStock" class="form-control" placeholder="0">
                            </div>

                            <div class="col-12">
                                <label class="form-label small text-muted d-block mb-1 fw-bold">Gambar Produk:</label>
                                <div class="d-flex gap-3 mb-2">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="imgOption" id="optUrl" value="url" checked onchange="toggleImageInput()">
                                        <label class="form-check-label small" for="optUrl">Link URL</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="imgOption" id="optUpload" value="upload" onchange="toggleImageInput()">
                                        <label class="form-check-label small" for="optUpload">Upload File</label>
                                    </div>
                                </div>
                                
                                <input type="text" id="pImageURL" class="form-control" placeholder="https://...">
                                <input type="file" id="pImageFile" class="form-control hidden" accept="image/*">
                            </div>
                            
                            <div class="col-12 d-flex gap-2 mt-4">
                                <button type="submit" id="btnSubmit" class="btn btn-primary w-100 fw-bold">Simpan Produk</button>
                                <button type="button" onclick="resetForm()" id="btnCancel" class="btn btn-secondary w-25 hidden">Batal</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div id="productTable" class="row g-3">
                    </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // --- AUTHENTICATION ---
    async function checkAuth() {
        try {
            const res = await fetch('/api/check-auth'); // Panggil endpoint khusus
            if (res.ok) {
                const data = await res.json();
                if (data.loggedIn) {
                    showDashboard();
                    loadData();
                } else {
                    showLogin();
                }
            } else {
                showLogin();
            }
        } catch (err) {
            console.log('Server offline/error', err);
            showLogin();
        }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        const res = await fetch('/api/login', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: u, password: p})
        });
        if (res.ok) { showDashboard(); loadData(); } 
        else { document.getElementById('loginError').classList.remove('hidden'); }
    });

    async function logout() { await fetch('/api/logout', { method: 'POST' }); window.location.reload(); }
    
    function showLogin() { document.getElementById('loginSection').classList.remove('hidden'); document.getElementById('dashboardSection').classList.add('hidden'); }
    function showDashboard() { document.getElementById('loginSection').classList.add('hidden'); document.getElementById('dashboardSection').classList.remove('hidden'); }

    // --- DATA HANDLING ---
    function loadData() { loadOrders(); loadProducts(); }

    // 1. ORDERS
   async function loadOrders() {
        const res = await fetch('/api/orders');
        if(!res.ok) return;
        const orders = await res.json();
        const tbody = document.getElementById('orderTable');
        
        if(orders.length === 0) { 
            tbody.innerHTML = '<tr><td colspan="5" class="text-center p-4 text-muted">Belum ada pesanan masuk.</td></tr>'; 
            return; 
        }

        tbody.innerHTML = orders.map(o => `
            <tr class="${o.status === 'Dibatalkan' ? 'table-danger text-muted' : ''}">
                <td class="ps-3">
                    <strong class="d-block text-truncate" style="max-width: 150px;">${o.customerName}</strong>
                    <small class="text-muted" style="font-size: 0.75rem">${o.address.substring(0,20)}...</small>
                </td>
                <td>
                    <small class="d-block text-truncate" style="max-width: 120px;">
                        ${o.items.map(i => `${i.name}`).join(', ')}
                    </small>
                </td>
                <td class="fw-bold">Rp ${o.totalPrice.toLocaleString('id-ID')}</td>
                <td>
                    <select onchange="updateStatus('${o._id}', this.value)" class="form-select form-select-sm" style="min-width: 130px; font-size: 0.8rem;">
                        <option ${o.status=='Menunggu Konfirmasi'?'selected':''}>Menunggu Konfirmasi</option>
                        <option ${o.status=='Diproses'?'selected':''}>Diproses</option>
                        <option ${o.status=='Dalam Pengiriman'?'selected':''}>Dalam Pengiriman</option>
                        <option ${o.status=='Selesai'?'selected':''}>Selesai</option>
                        <option ${o.status=='Dibatalkan'?'selected':''} style="color:red; font-weight:bold;">Dibatalkan</option>
                    </select>
                </td>
                <td class="text-end pe-3">
                    <div class="d-flex justify-content-end gap-1">
                        <a href="https://wa.me/${o.whatsapp}" target="_blank" class="btn btn-success btn-sm btn-sm-mobile">
                            📞
                        </a>
                        <button onclick="deleteOrder('${o._id}')" class="btn btn-outline-danger btn-sm btn-sm-mobile" title="Hapus Pesanan">
                            🗑️
                        </button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    // Tambahkan fungsi deleteOrder baru di bawah loadOrders
   async function deleteOrder(id) {
    if(confirm('⚠️ Yakin ingin menghapus riwayat pesanan ini secara permanen?')) {
        // 1. Hapus data di server
        const res = await fetch(`/api/orders/${id}`, { method: 'DELETE' });
        
        // 2. Jika sukses, refresh tabel
        if (res.ok) {
            loadOrders(); // <--- Ini yang bikin otomatis hilang tanpa refresh
        } else {
            alert('Gagal menghapus pesanan');
        }
    }
}

    async function updateStatus(id, status) {
    // 1. Kirim data ke server
    const res = await fetch(`/api/orders/${id}`, { 
        method: 'PUT', 
        headers: {'Content-Type': 'application/json'}, 
        body: JSON.stringify({status}) 
    });

    // 2. Cek apakah sukses
    if (res.ok) {
        // 3. INI KUNCINYA: Panggil ulang data agar tabel otomatis refresh
        await loadOrders(); 
        
        // (Opsional) Kasih notifikasi kecil biar keren
        // alert('Status berhasil diubah!'); 
    } else {
        alert('Gagal update status');
    }
}

    // 2. PRODUCTS (Responsive Grid)
    window.toggleImageInput = () => {
        const isUpload = document.getElementById('optUpload').checked;
        document.getElementById('inputUrlGroup').classList.toggle('hidden', isUpload);
        document.getElementById('inputFileGroup').classList.toggle('hidden', !isUpload);
        // Manual toggle logic karena struktur HTML baru
        if(isUpload) {
            document.getElementById('pImageURL').classList.add('hidden');
            document.getElementById('pImageFile').classList.remove('hidden');
        } else {
            document.getElementById('pImageURL').classList.remove('hidden');
            document.getElementById('pImageFile').classList.add('hidden');
        }
    };

    async function loadProducts() {
        const res = await fetch('/api/products');
        allProducts = await res.json();
        
        // Grid System: col-12 (HP), col-sm-6 (Tablet Kecil), col-md-4 (Laptop)
        document.getElementById('productTable').innerHTML = allProducts.map(p => `
            <div class="col-12 col-sm-6 col-md-4">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body d-flex align-items-center gap-3">
                        <img src="${p.image || 'https://via.placeholder.com/60'}" class="product-img-thumb flex-shrink-0">
                        <div class="flex-grow-1 overflow-hidden">
                            <h6 class="card-title mb-1 text-truncate">${p.name}</h6>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="text-primary fw-bold small">Rp ${p.price.toLocaleString('id-ID')}</span>
                                <span class="badge bg-light text-dark border">Stok: ${p.stock}</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer bg-white border-top-0 d-flex gap-2">
                        <button onclick="editProduct('${p._id}')" class="btn btn-warning btn-sm w-50 fw-bold" style="font-size:0.8rem">✏️ Edit</button>
                        <button onclick="deleteProduct('${p._id}')" class="btn btn-outline-danger btn-sm w-50" style="font-size:0.8rem">🗑️ Hapus</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    document.getElementById('productForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('pId').value;
        const url = id ? `/api/products/${id}` : '/api/products';
        const method = id ? 'PUT' : 'POST';
        const formData = new FormData();
        
        formData.append('name', document.getElementById('pName').value);
        formData.append('price', document.getElementById('pPrice').value);
        formData.append('stock', document.getElementById('pStock').value);
        
        if (document.getElementById('optUpload').checked) {
            const file = document.getElementById('pImageFile').files[0];
            if(file) formData.append('imageFile', file);
        } else {
            formData.append('imageURL', document.getElementById('pImageURL').value);
        }

        const res = await fetch(url, { method, body: formData });
        if(res.ok) { loadProducts(); resetForm(); } else { alert('Gagal menyimpan'); }
    });

    window.editProduct = (id) => {
        const p = allProducts.find(x => x._id === id);
        if(!p) return;
        
        document.getElementById('pId').value = p._id;
        document.getElementById('pName').value = p.name;
        document.getElementById('pPrice').value = p.price;
        document.getElementById('pStock').value = p.stock;
        
        document.getElementById('optUrl').checked = true;
        toggleImageInput();
        document.getElementById('pImageURL').value = p.image || '';

        // UI Update
        const header = document.querySelector('.card-header');
        header.classList.remove('bg-primary');
        header.classList.add('bg-warning', 'text-dark');
        document.getElementById('formTitle').innerText = '✏️ Edit Produk';
        document.getElementById('formTitle').classList.remove('text-white');
        
        const btn = document.getElementById('btnSubmit');
        btn.innerText = 'Update Produk';
        btn.classList.remove('btn-primary');
        btn.classList.add('btn-warning');
        
        document.getElementById('btnCancel').classList.remove('hidden');
        document.getElementById('productForm').scrollIntoView({ behavior: 'smooth' });
    };

    window.resetForm = () => {
        document.getElementById('productForm').reset();
        document.getElementById('pId').value = '';
        document.getElementById('optUrl').checked = true;
        toggleImageInput();

        const header = document.querySelector('.card-header');
        header.classList.add('bg-primary');
        header.classList.remove('bg-warning', 'text-dark');
        document.getElementById('formTitle').innerText = '➕ Tambah Produk';
        document.getElementById('formTitle').classList.add('text-white');

        const btn = document.getElementById('btnSubmit');
        btn.innerText = 'Simpan Produk';
        btn.classList.add('btn-primary');
        btn.classList.remove('btn-warning');

        document.getElementById('btnCancel').classList.add('hidden');
    };

    async function deleteProduct(id) {
        if(confirm('Hapus produk?')) { await fetch(`/api/products/${id}`, { method: 'DELETE' }); loadProducts(); }
    }

    // --- FITUR AUTO REFRESH (REALTIME) ---
    // Mengecek pesanan baru setiap 5 detik (5000 ms)
    setInterval(() => {
        // Hanya refresh jika sedang di tab "Pesanan" agar tidak mengganggu saat edit produk
        const activeTab = document.querySelector('.nav-link.active').getAttribute('href');
        if (activeTab === '#pesanan') {
            loadOrdersSilent(); 
        }
    }, 5000);

    // Fungsi load orders tanpa mereset tampilan jika tidak ada perubahan
    // (Agar dropdown tidak tertutup sendiri saat sedang dipilih)
    let lastOrderCount = 0;
    async function loadOrdersSilent() {
        try {
            const res = await fetch('/api/orders');
            if(!res.ok) return;
            const orders = await res.json();
            
            // Cek: Apakah jumlah pesanan berubah?
            // Jika jumlahnya sama, JANGAN refresh tabel (biar admin tidak terganggu)
            if (orders.length !== lastOrderCount) {
                lastOrderCount = orders.length; // Update jumlah terakhir
                loadOrders(); // Panggil fungsi asli untuk render tabel
                
                // (Opsional) Mainkan suara notifikasi jika pesanan bertambah
                // playNotificationSound(); 
            }
        } catch (err) {
            console.log('Auto-refresh skip (koneksi lambat)');
        }
    }

    checkAuth();
</script>
</body>
</html>
